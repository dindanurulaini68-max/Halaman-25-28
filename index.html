<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensiklopedia Sisingaan Halaman 25-28</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');

      // 1. Ambil target entity masing-masing halaman
      const target0 = document.querySelector('#target0');
      const target1 = document.querySelector('#target1');
      const target2 = document.querySelector('#target2');
      const target3 = document.querySelector('#target3');
      const target4 = document.querySelector('#target4');
  
      // 2. Ambil audio & video masing-masing halaman
      const audio25 = document.querySelector('#audio_gerakan');
      const audio26 = document.querySelector('#audio_bubuka26');
      const audio27A = document.querySelector('#audio_bubuka27A');
      const audio27B = document.querySelector('#audio_bubuka27B');
      const audio28 = document.querySelector('#audio_bubuka28');

      // Unmute & Unlock Audio/Video secara otomatis pada sentuhan/klik pertama di layar
      const unlockMediaOnFirstTouch = () => {
        // Unlock Audio
        [audio25, audio26, audio27A, audio27B, audio28].forEach(audio => {
          if (audio) {
            audio.play().then(() => {
              audio.pause();
              audio.currentTime = 0;
            }).catch(() => {});
          }
        });

        // Unlock Video 
        [].forEach(video => {
          if (video) {
            video.muted = false;
            video.play().then(() => {
              video.pause();
              video.currentTime = 0;
            }).catch(() => {});
          }
        });

        window.removeEventListener('touchstart', unlockMediaOnFirstTouch);
        window.removeEventListener('click', unlockMediaOnFirstTouch);
      };

      window.addEventListener('touchstart', unlockMediaOnFirstTouch, { once: true });
      window.addEventListener('click', unlockMediaOnFirstTouch, { once: true });

      // Helper Listener Audio
      function setupAudioTarget(targetEl, audioEl) {
        if (!targetEl || !audioEl) return;

        targetEl.addEventListener("targetFound", () => {
          audioEl.play().catch(e => console.log("Autoplay audio terhalang: ", e));
        });

        targetEl.addEventListener("targetLost", () => {
          audioEl.pause();
          audioEl.currentTime = 0;
        });
      }

      // Helper Listener Video
      function setupVideoTarget(targetEl, videoEl) {
        if (!targetEl || !videoEl) return;

        targetEl.addEventListener("targetFound", () => {
          videoEl.play().catch(e => {
            console.log("Autoplay video terhalang, mencoba memutar tanpa suara...", e);
            videoEl.muted = true; // Fallback jika browser tetap memblokir audio video
            videoEl.play();
          });
        });

        targetEl.addEventListener("targetLost", () => {
          videoEl.pause();
          videoEl.currentTime = 0;
        });
      }

      // Pasang Listener Audio
      setupAudioTarget(target0, audio25);
      setupAudioTarget(target1, audio26);
      setupAudioTarget(target2, audio27A);
      setupAudioTarget(target3, audio27B);
      setupAudioTarget(target4, audio28);
    
      // Pasang Listener Video

    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">

<a-scene 
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/;"
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 12;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

  <a-assets>
    <!-- Target 0: Halaman 25 -->
    <a-asset-item id="pengusungModel25" src="./halaman 25/pengusung halaman 12.glb"></a-asset-item>
    <a-asset-item id="ragamgerak2Model25" src="./halaman 25/ragam gerak 2.glb"></a-asset-item>
    <a-asset-item id="ragamgerakModel25" src="./halaman 25/ragam gerak.glb"></a-asset-item>
    <audio id="audio_gerakan" src="./halaman 25/gerakan opening 25 audio.mp3" preload="auto"></audio>

    <!-- Target 1: Halaman 26 -->
    <a-asset-item id="ceweModel26" src="./halaman 26/cewe berdua.glb"></a-asset-item>
    <a-asset-item id="bertigaModel26" src="./halaman 26/orang bertiga.glb"></a-asset-item>
    <a-asset-item id="setModel26" src="./halaman 26/set sisingaan.glb"></a-asset-item>
    <audio id="audio_bubuka26" src="./halaman 26/bubuka26 audio.mp3" preload="auto"></audio>

    <!-- Target 2: Halaman 27A -->
    <a-asset-item id="patungModel27A" src="./halaman 27A/patung_singa.glb"></a-asset-item>
    <a-asset-item id="salamModel27A" src="./halaman 27A/salam.glb"></a-asset-item>
    <audio id="audio_bubuka27A" src="./halaman 27A/bubuka27a audio.mp3" preload="auto"></audio>

    <!-- Target 3: Halaman 27B -->
    <a-asset-item id="patungModel27B" src="./halaman 27B/patung_singa.glb"></a-asset-item>
    <a-asset-item id="mengangkatModel27B" src="./halaman 27B/mengangkat.glb"></a-asset-item>
    <audio id="audio_bubuka27B" src="./halaman 27B/bubuka27b audio.mp3" preload="auto"></audio>

    <!-- Target 4: Halaman 28 -->
    <a-asset-item id="angkatModel28" src="./halaman 28/angkat sisingaan.glb"></a-asset-item>
    <audio id="audio_bubuka28" src="./halaman 28/bubuka28 audio.mp3" preload="auto"></audio>

  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- TARGET 0 (Halaman 25) -->
  <a-entity id="target0" mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#pengusungModel25" position="-0.5 0 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-gltf-model src="#ragamgerak2Model25" position="-0.1 0 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#ragamgerakModel25" position="0.1 0 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#pengusungModel25" position="0.4 0 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer></a-gltf-model>
  </a-entity>

  <!-- TARGET 1 (Halaman 26) -->
  <a-entity id="target1" mindar-image-target="targetIndex: 1">
    <a-gltf-model src="#ceweModel26" position="-0.5 0.7 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-gltf-model src="#bertigaModel26" position="0.1 0.7 0" scale="0.3 0.3 0.3" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#setModel26" position="0 0 0" scale="8 8 8" rotation="90 0 0" animation-mixer></a-gltf-model>
  </a-entity>

  <!-- TARGET 2 (Halaman 27A) -->
  <a-entity id="target2" mindar-image-target="targetIndex: 2">
    <a-gltf-model src="#patungModel27A" position="-0.1 -0.2 0" scale="0.4 0.4 0.4" rotation="90 0 0" animation-mixer animation></a-gltf-model>
    <a-gltf-model src="#salamModel27A" position="-0.5 -0.44 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#salamModel27A" position="0.5 -0.44 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#salamModel27A" position="-0.3 0.18 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#salamModel27A" position="0.26 0.18 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer></a-gltf-model>
  </a-entity>

  <!-- TARGET 3 (Halaman 27B) -->
  <a-entity id="target3" mindar-image-target="targetIndex: 3">
    <a-gltf-model src="#patungModel27B" position="-0.03 -0.12 0.07" scale="0.4 0.4 0.4" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#mengangkatModel27B" position="-0.3 -0.4 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#mengangkatModel27B" position="0.26 -0.4 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#mengangkatModel27B" position="-0.3 0.18 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer></a-gltf-model>
    <a-gltf-model src="#mengangkatModel27B" position="0.26 0.18 0" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer></a-gltf-model>
  </a-entity>

  <!-- TARGET 4 (Halaman 28) -->
  <a-entity id="target4" mindar-image-target="targetIndex: 4">
    <a-gltf-model src="#angkatModel28" position="0 0 0" scale="1 1 1" rotation="90 0 0" animation-mixer></a-gltf-model>
  </a-entity>

</a-scene>

</body>
</html>
